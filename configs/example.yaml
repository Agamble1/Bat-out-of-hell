scanner:
  timeout: 5
  max_threads: 10
  user_agent: "BAT-Scanner/1.0"

port_scanner:
  timeout: 2
  ports:
    - 21    # FTP
    - 22    # SSH
    - 23    # Telnet
    - 25    # SMTP
    - 53    # DNS
    - 80    # HTTP
    - 443   # HTTPS
    - 445   # SMB
    - 3306  # MySQL
    - 3389  # RDP
    - 5432  # PostgreSQL
    - 8080  # HTTP-Proxy
    - 8443  # HTTPS-Alt

logging:
  level: INFO
  file: logs/bat_scanner.log

reports:
  output_dir: reports
  format: json
